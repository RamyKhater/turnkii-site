<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/fonts.css" />
<style>
  :root{--ink:#12130E;--cream:#F6F3EC;--paper:#FFFFFF;--sand:#EFEBE1;--line:#E4E0D5;--lime:#D6F23C;--olive:#4E5A16;--sub:#5B5B4E;--muted:#8A8A79;--serif:'Instrument Serif',Georgia,serif;--sans:Manrope,system-ui,-apple-system,sans-serif}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit;text-decoration:none}img{max-width:100%}
  .wrap{max-width:760px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
  header{background:var(--ink);color:var(--cream)}
  .hrow{display:flex;align-items:center;gap:16px;padding:14px 0;max-width:1200px;margin:0 auto;padding-left:clamp(16px,4vw,40px);padding-right:clamp(16px,4vw,40px)}
  .brand img{height:24px;display:block}
  .hrow .sp{flex:1}
  .hrow a.cta{background:var(--lime);color:var(--ink);border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px}
  .hero{background:var(--ink);color:var(--cream);padding:clamp(28px,5vw,52px) 0 clamp(24px,4vw,40px)}
  .eb{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--lime)}
  .hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,5vw,50px);line-height:1.03;margin:12px 0 0}
  .hero p{font-size:clamp(15px,2vw,18px);color:rgba(246,243,236,.82);margin:12px 0 0;max-width:56ch}
  .panel{margin:clamp(-24px,-3vw,-32px) 0 clamp(40px,7vw,80px)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 20px 50px rgba(18,19,14,.08)}
  footer{background:var(--ink);color:rgba(246,243,236,.72)}
  .frow{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:center;padding:28px 0;max-width:1200px;margin:0 auto;padding-left:clamp(16px,4vw,40px);padding-right:clamp(16px,4vw,40px)}
  .frow .brand{margin-right:auto}.frow .brand img{height:22px}
  footer a{color:rgba(246,243,236,.72);font-size:14px;font-weight:600}footer a:hover{color:var(--lime)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="brand" href="/"><img src="assets/turnkii-logo.png" alt="Turnkii" /></a>
    <span class="sp"></span>
    <a class="cta" href="/book">Book a meeting</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eb">Your meeting</div>
    <h1>Manage your booking</h1>
    <p>Reschedule to another open time, or cancel — no phone calls needed.</p>
  </div>
</section>

<section class="panel">
  <div class="wrap">
    <div class="card"><div data-managebooking-slot></div></div>
  </div>
</section>

<footer>
  <div class="frow">
    <a class="brand" href="/"><img src="assets/turnkii-logo.png" alt="Turnkii" /></a>
    <a href="/">Home</a>
    <a href="/book">Book a meeting</a>
    <a href="/privacy.html">Privacy policy</a>
    <a href="/terms.html">Terms &amp; conditions</a>
  </div>
</footer>
</body>
</html>
